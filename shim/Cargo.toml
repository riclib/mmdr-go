[package]
name = "mmdr-shim"
version = "0.1.0"
edition = "2021"
publish = false
description = "C-ABI shim over mermaid-rs-renderer for the github.com/riclib/mmdr-go cgo binding."
license = "MIT"

[lib]
# Produces libmmdr.a (static archive) that the Go side links via cgo.
name = "mmdr"
crate-type = ["staticlib"]

[dependencies]
# Pinned exact: an upstream bump is deliberate work, not an automatic float.
# Keep this in sync with UPSTREAM_VERSION in src/lib.rs and .mmdr-version.
mermaid-rs-renderer = "=0.2.2"

[profile.release]
# Smaller archive; rendering is not hot enough to need opt-level=3 over "s".
opt-level = "s"
lto = true
codegen-units = 1
